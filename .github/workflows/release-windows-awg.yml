name: Release Windows core

# Ships the Windows sidecar binary built from this fork, so that clients get the
# AmneziaWG outbound. The inherited release.yml builds the full upstream matrix
# and needs cached geo/wintun assets, which this fork does not carry.
# Geo files stay on the upstream release: they are not ours and are updated on a
# different cadence than the core.

on:
  push:
    tags:
      - "v*-awg.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build xray.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p build_assets
          COMMIT=$(git rev-parse --short HEAD)
          go build -o build_assets/xray.exe -trimpath -buildvcs=false \
            -ldflags "-X github.com/xtls/xray-core/core.build=${COMMIT} -s -w -buildid=" \
            ./main

      - name: Verify the AmneziaWG dependency is linked in
        run: |
          go version -m build_assets/xray.exe | tee modules.txt
          grep -q 'github.com/amnezia-vpn/amneziawg-go' modules.txt

      - name: Package
        run: |
          cd build_assets
          zip -9 ../Xray-windows-64-awg.zip xray.exe
          cd ..
          sha256sum Xray-windows-64-awg.zip | tee Xray-windows-64-awg.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Xray-windows-64-awg.zip
            Xray-windows-64-awg.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Xray-windows-64-awg
          path: build_assets/xray.exe
