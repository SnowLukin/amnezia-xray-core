syntax = "proto3";

package xray.core.app.observatory.health;
option csharp_namespace = "Xray.App.Observatory.Health";
option go_package = "github.com/xtls/xray-core/app/observatory/health";
option java_package = "com.xray.app.observatory.health";
option java_multiple_files = true;


// Config of the health observatory. All durations are int64 nanoseconds.
message Config {
  reserved 1;
  PassiveConfig passive = 2;
  // A path names its probe profile; without one it uses the built-in probe.
  repeated ProbeProfile probes = 3;
  ConnectivityConfig connectivity = 4;
  ScheduleConfig schedule = 5;
  EventsConfig events = 6;
  NetworkConfig network = 7;
  // Sources of fresh outbounds for balancers.
  repeated ProviderConfig providers = 8;
  ReportConfig report = 9;
  SleepConfig sleep = 10;
  repeated PathDefinition paths = 11;
  WakeConfig wake = 12;
}

// User presence checks stale selected paths even while idle. Zero keeps the
// default duration, a negative value removes the freshness or interval limit.
message WakeConfig {
  int64 freshness = 1;
  int64 min_interval = 2;
}

// PassiveConfig decides when user traffic makes an outbound suspect.
message PassiveConfig {
  // Evidence older than this is forgotten.
  int64 window = 1;
  // A dial that has not finished after this long counts as failed.
  int64 dial_timeout = 2;
  // No response this long after the first write counts as failed.
  int64 first_byte_timeout = 3;
  // No progress this long while a written request waits for an answer
  // counts as a stall.
  int64 stall_timeout = 4;
  // Failures needed in the window to suspect an outbound.
  int32 failures_to_suspect = 5;
  // For failures that depend on the destination (no response, stall),
  // how many different destinations they must cover.
  int32 min_distinct_targets = 6;
  // A connection that downloaded this many bytes proves the outbound works.
  int64 success_bytes = 7;
  // How often live connections are checked for stalls and timeouts.
  int64 sweep_interval = 8;
  // Failures of dial and handshake only, without response and stall checks.
  bool is_dial_only = 9;
  // A young connection that received less than success_bytes and then went
  // silent for stall_timeout counts as a stall, even when nothing waits for
  // an answer. This is how a censor freezing connections after the first
  // kilobytes looks from the client. Only connections that went silent within
  // this time after the dial count.
  int64 partial_stall_max_age = 10;
  bool should_ignore_partial_stalls = 11;
  // A stall needs at least this much written since the last read, so small
  // control writes such as HTTP/2 window updates do not count.
  int64 stall_min_write_bytes = 12;
  // A partial stall needs at least this much read, so idle keep-alive
  // connections with small answers do not count.
  int64 partial_stall_min_bytes = 13;
  // When an outbound is found down, its connections that have not received
  // anything yet are ended right away, so applications retry on the outbound
  // chosen now instead of waiting for their own timeout. This keeps them.
  bool should_keep_pending_on_down = 14;
  // When an outbound is found down, its connections that started before
  // and then receive nothing for stall_timeout are ended too: they cannot
  // progress on a path the core has left, and they keep its tunnel awake.
  // This keeps them.
  bool should_keep_silent_on_down = 15;
  // Without recent proof of life, one path failure asks for a probe.
  // Zero uses the default; a negative value disables this check.
  int64 lone_failure_after = 16;
}

message ProbeProfile {
  string name = 1;
  string destination = 2;
  string method = 3;
  // Accepted status codes. Empty accepts 200-299.
  repeated int32 expected_statuses = 4;
  // The probe fails unless it reads at least this many body bytes.
  int64 min_bytes = 5;
  int64 timeout = 6;
  // The probe fails when no byte arrives for this long.
  int64 progress_timeout = 7;
  repeated ProbeStep steps = 8;
}

message ProbeStep {
  string name = 1;
  repeated string destinations = 2;
  bool is_optional = 3;
  string method = 4;
  // Accepted status codes. Empty accepts 200-299.
  repeated int32 expected_statuses = 5;
  int64 min_bytes = 6;
  int64 timeout = 7;
  int64 progress_timeout = 8;
}

// ConnectivityConfig tells a dead outbound from a dead network.
message ConnectivityConfig {
  // Outbound used for the check, usually one that bypasses the tunnel.
  string outbound = 1;
  string destination = 2;
  int64 timeout = 3;
  // While the network looks down, recheck it with this backoff.
  Backoff recheck_backoff = 4;
  // How long decisions stay paused while the check keeps failing. After that
  // they resume, but outbounds ruled out meanwhile come back once a check
  // passes: either the outage is long or the check cannot reach its
  // destination in this network.
  int64 max_pause = 5;
  // Outbounds whose working connections prove that the network works, such
  // as a direct outbound for sites outside the tunnel. A connection counts
  // once it receives successBytes.
  repeated string witnesses = 6;
}

message Backoff {
  int64 initial_delay = 1;
  double multiplier = 2;
  int64 max_delay = 3;
  // Random spread, 0.2 means +-20%.
  double jitter_fraction = 4;
}

message ScheduleConfig {
  // Without user traffic for this long, no probes and no timers run.
  int64 idle_after = 1;
  // How long a failed outbound rests before it may be probed again.
  Backoff quarantine = 2;
  // Probes running at the same time, never two of one server name.
  int32 max_concurrent_probes = 3;
  // Minimum pause between probe starts; with concurrent above one, that many
  // may start within it.
  int64 min_probe_interval = 4;
  // Random spread of spacing.
  double probe_jitter_fraction = 5;
  // Probe starts per server name per minute. The server name is the TLS or
  // REALITY server name, or the server address without one.
  int32 probes_per_server_name_per_minute = 6;
  // Probe starts per minute in total.
  int32 probes_per_minute = 7;
  // After a probe cleared a suspicion, the same outbound is not suspected
  // again for this long.
  int64 suspect_cooldown = 8;
  // Probes the host asks for.
  HostProbesConfig host_probes = 9;
}

// HostProbesConfig limits probes the host asks for on top of the probe
// budget: they wait for the probes of the observer and never take more than
// half of the budget.
message HostProbesConfig {
  // Host probe starts per minute, at most half of per_minute.
  int32 probes_per_minute = 1;
  // An outbound that works and proved it within this long is answered
  // without a probe.
  int64 reuse_window = 2;
  // Outbounds in one request.
  int32 max_outbounds = 3;
  // A request still waiting after this long ends; its probes that have not
  // started are dropped.
  int64 timeout = 4;
}

message EventsConfig {
  // Maximum events kept until the host drains them.
  int32 max_events = 1;
  // Maximum size of kept events in bytes.
  int64 max_bytes = 2;
}

// ReportConfig sets when the host gets a report of the decisions.
message ReportConfig {
  // A window with decisions is reported once it is this long. Zero is the
  // default of 24 hours, negative turns the periodic report off.
  int64 interval = 1;
  // Share of runs whose final report is kept without a routing decision.
  double quiet_share = 2;
}

// SleepConfig sets when an outbound that can release what it holds while
// idle, such as a WireGuard tunnel, is put to sleep. Only outbounds no
// balancer chooses sleep; the next connection wakes them.
message SleepConfig {
  // How long after its last use an outbound sleeps. Zero is the default of
  // 5 minutes, negative turns sleep off.
  int64 after_last_use = 1;
  // Connections that received nothing for this long are ended on an
  // outbound that can sleep and that no balancer has chosen for after_last_use, so
  // that it can sleep. Zero, the default, and negative turn it off.
  int64 close_idle_after = 2;
}

message NetworkConfig {
  // Do not remember the last working outbound per network id given by the
  // host.
  bool no_memory = 1;
  // How many networks to remember.
  int32 max_networks = 2;
}

message PathDefinition {
  string tag = 1;
  string balancer = 2;
  string group = 3;
  float cost = 4;
  bool is_lazy = 5;
  int64 return_interval = 6;
  string probe = 7;
}

message PathGroup {
  string name = 1;
  float cost = 2;
  bool is_lazy = 3;
  int64 return_interval = 4;
  string probe = 5;
  int32 failed_in_row_to_leave = 6;
}

message SelectorConfig {
  repeated PathDefinition paths = 1;
  repeated PathGroup groups = 2;
  reserved 3;
  // Move traffic to the next candidate without probing it first.
  bool skip_probe_before_switch = 4;
  // When to probe the current outbound before leaving it.
  ConfirmMode confirm_with_probe = 5;
  // Minimum time on an outbound before returning to a cheaper one.
  int64 min_hold_time = 6;
  ReturnToCheaperConfig return_to_cheaper = 7;
  // Start pinned to this tag until the host releases the pin.
  string start_pinned_outbound = 8;
  NetworkChangeMode network_change_action = 9;
  // Start with this tag instead of the cheapest one, without pinning it. The
  // host passes the outbound that worked last time, so a restart needs no
  // probing.
  string start_outbound = 10;
  // Releases the start pin by itself this long after the start, as when a
  // host verifies the pinned outbound within a known time and stops the core
  // when it fails. Zero keeps the pin until the host releases it.
  int64 start_pin_timeout = 11;
  // Skip the probe that checks a strong down after failover.
  bool should_skip_down_audit = 12;
}

enum ConfirmMode {
  // Probe only when the evidence includes destination-dependent failures.
  AUTO = 0;
  ALWAYS = 1;
  NEVER = 2;
}

enum NetworkChangeMode {
  // Forget results, probe the current outbound once, try cheaper ones.
  RECHECK = 0;
  // Only forget results.
  FORGET = 1;
  // Ignore network changes.
  IGNORE = 2;
}

// ReturnToCheaperConfig controls returns to cheaper outbounds while the current one
// works.
message ReturnToCheaperConfig {
  // Check cheaper outbounds this often while traffic flows.
  int64 interval = 1;
  // Start the interval right away instead of at a random point; with a
  // random point devices do not check together.
  bool skip_random_phase = 2;
  // Successful probes in a row needed to return.
  int32 probes_to_return = 3;
  // Pause between those probes.
  int64 probe_interval = 4;
  // If the cheaper outbound fails this soon after the return, the next
  // attempt waits longer.
  int64 penalty_window = 5;
  double penalty_multiplier = 6;
  int64 max_penalty_delay = 7;
  // Do not check cheaper outbounds after a network change.
  bool skip_try_on_network_change = 8;
  // Check after a change to any network, not only to one not seen before.
  bool try_on_all_networks = 9;
}

// ProviderConfig fetches a set of outbounds over HTTP when one of its
// triggers fires and puts it into a balancer without a restart. Durations
// and counts left at zero take their defaults; a negative value disables
// the trigger or the limit where noted.
message ProviderConfig {
  // Names the provider in events, status and refresh requests.
  string tag = 1;
  // The set is fetched from this URL with method.
  string url = 2;
  // Request headers. Credentials belong here, not in the URL.
  map<string, string> headers = 3;
  // Outbound or leastCost balancer tags to send the request through, tried
  // in order until one answers. Empty routes the request like any other.
  repeated string via = 4;
  // Timeout of one request through one via.
  int64 timeout = 5;
  // Larger answers are rejected.
  int64 max_bytes = 6;
  ProviderTriggers triggers = 7;
  ProviderLimits limits = 8;
  ProviderApply apply = 9;
  // POST, the default, sends the state of the core to the provider; GET
  // sends no body, for a static file on a web server.
  string method = 10;
  // An answer of the provider as JSON, applied when the core starts: the
  // answer of a connect, or a set the host kept, which may add receivedAt.
  // A broken one is reported and the core starts without it.
  bytes initial_answer = 11;
  // Names the config the core was started with, as the backend that
  // generated it named it. An answer that names another one tells the host
  // to fetch the config anew. Empty takes the one of a fresh initial.
  string base_version = 12;
}

message ProviderTriggers {
  // Refresh this long after the previous successful refresh. Negative
  // disables.
  int64 interval = 1;
  // Random spread of interval and of nextRefreshIn, 0.2 means +-20%.
  double jitter_fraction = 2;
  // Refresh when the balancer has fewer usable candidates than this.
  // Negative disables.
  int32 min_healthy_outbounds = 3;
  // Do not refresh when the balancer has no usable candidate left.
  bool skip_refresh_when_exhausted = 4;
  // Refresh when the balancer keeps outbounds of at least this cost.
  CostTrigger when_cost_above = 5;
  // Refresh when the set is older than this. Negative disables.
  int64 max_age = 6;
  RefreshOnNetwork network_change_mode = 7;
  // How long after a network change the balancer is judged.
  int64 network_settle_delay = 8;
  // Renewal of the leases an answer gives its outbounds.
  ExpiryTrigger expiry = 9;
}

// ExpiryTrigger renews a lease before it ends. Zero takes the default, a
// negative value turns the part off.
message ExpiryTrigger {
  // Share of the lease after which a refresh renews it, 0.5 by default.
  // Negative turns renewal off; the lease still ends.
  double renew_at_fraction = 1;
  // Share of the lease after which the renewal is urgent, 0.8 by default.
  double urgent_at_fraction = 2;
  // Random spread of renew_at_fraction, 0.1 means +-10%. Negative is none.
  double jitter_fraction = 3;
}

message CostTrigger {
  float cost = 1;
  // How long the balancer has to keep such outbounds.
  int64 after = 2;
}

enum RefreshOnNetwork {
  // Only in a network without a remembered working outbound, and only when
  // the balancer did not settle on its cheapest candidate there.
  REFRESH_UNKNOWN_NOT_CHEAPEST = 0;
  REFRESH_UNKNOWN = 1;
  REFRESH_ANY = 2;
  REFRESH_NEVER = 3;
}

message ProviderLimits {
  // Minimum time between the starts of two refreshes.
  int64 min_interval = 1;
  // The same for refreshes because the balancer is exhausted or the host
  // asked for one.
  int64 exhausted_min_interval = 2;
  // Refreshes started within an hour. Negative removes the limit.
  int32 max_refreshes_per_hour = 3;
  // Pause after failed refreshes.
  Backoff backoff = 4;
  // Pause of every trigger but the host after the backend refused the
  // headers of the provider, 1 h by default. Negative waits for new headers.
  int64 auth_retry_delay = 5;
}

message ProviderApply {
  // Balancer whose candidates the set feeds. Its selector has to match
  // tag_prefix.
  string balancer = 1;
  // Prefix added to every outbound tag of the set. The provider owns every
  // outbound whose tag starts with it, including ones from the config.
  string tag_prefix = 2;
  // Outbounds that left the set keep serving their connections this long.
  int64 drain_timeout = 3;
  // Larger sets are rejected.
  int32 max_outbounds = 4;
  // Protocols the set may use. Empty allows the protocols that carry traffic
  // to a server; an outbound that sends traffic straight out, such as
  // freedom, is refused unless listed here.
  repeated string allowed_protocols = 5;
  // Applies the routing rules, balancers and domain strategy of an answer
  // without a restart. Off, the routing of an answer is ignored.
  bool is_routing_accepted = 6;
  // Header names an answer may set over those of the config, to rotate the
  // token of the provider. Empty allows Authorization.
  repeated string accepted_headers = 7;
  // An answer may set no header; one that has headers is refused.
  bool fixed_headers = 8;
}
