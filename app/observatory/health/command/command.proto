syntax = "proto3";
package xray.core.app.observatory.health.command;
option csharp_namespace = "Xray.Core.App.Observatory.Health.Command";
option go_package = "github.com/xtls/xray-core/app/observatory/health/command";
option java_package = "com.xray.core.app.observatory.health.command";
option java_multiple_files = true;

message CommandError { string code = 1; string message = 2; }
// Same Result DTO as native JSON. data is JSON of the operation's typed data,
// never a JSON-encoded string containing that object. Transport errors are
// reserved for a failed RPC; command refusals live in error.
message Result { bool success = 1; string run = 2; string data = 3; CommandError error = 4; }
message StatusRequest {}
message DrainEventsRequest {}
message NetworkChangedRequest { string network = 1; }
message NetworkChangedWithLabelsRequest { string network = 1; map<string,string> labels = 2; }
message NetworkLostRequest {}
message UserPresentRequest {}
message SetMemoryLowRequest { bool is_low = 1; }
message PinRequest { string balancer = 1; string outbound = 2; string run = 3; }
message ReleaseRequest { string balancer = 1; string run = 2; }
message RequestProviderRefreshRequest { string provider = 1; }
message PeekReportRequest {}
message TakeReportRequest { bool is_final = 1; }
message RequestProbeRequest {
 string balancer = 1;
 repeated string outbounds = 2;
 // Transport convenience only: same ticket/work as an immediate request.
 int64 wait_ms = 3;
 bool is_udp = 4;
}
message ProbeResultRequest { string run = 1; uint64 id = 2; }
message SetProviderHeadersRequest { string provider = 1; map<string,string> headers = 2; }
message ExportProviderSetRequest {
 string provider = 1;
 uint64 after = 2;
 // data.set is an object valid as providers[].initialAnswer. It contains
 // credentials and belongs only in protected local storage.
}
message SetProviderURLsRequest { string provider = 1; repeated string urls = 2; }
message ExportTraceRequest {
 uint64 after = 1;
 // Bound on the bytes of records in one answer, 0 for none; data.is_more
 // tells to ask again with data.seq.
 uint32 max_bytes = 2;
}
message AdaptiveHeaderRequest {}
message ViewRequest {}
service HealthService {
 rpc Status(StatusRequest) returns (Result) {}
 rpc View(ViewRequest) returns (Result) {}
 rpc DrainEvents(DrainEventsRequest) returns (Result) {}
 rpc NetworkChanged(NetworkChangedRequest) returns (Result) {}
 rpc NetworkChangedWithLabels(NetworkChangedWithLabelsRequest) returns (Result) {}
 rpc NetworkLost(NetworkLostRequest) returns (Result) {}
 rpc UserPresent(UserPresentRequest) returns (Result) {}
 rpc SetMemoryLow(SetMemoryLowRequest) returns (Result) {}
 rpc Pin(PinRequest) returns (Result) {}
 rpc Release(ReleaseRequest) returns (Result) {}
 rpc RequestProviderRefresh(RequestProviderRefreshRequest) returns (Result) {}
 rpc PeekReport(PeekReportRequest) returns (Result) {}
 rpc TakeReport(TakeReportRequest) returns (Result) {}
 rpc RequestProbe(RequestProbeRequest) returns (Result) {}
 rpc ProbeResult(ProbeResultRequest) returns (Result) {}
 rpc SetProviderHeaders(SetProviderHeadersRequest) returns (Result) {}
 rpc ExportProviderSet(ExportProviderSetRequest) returns (Result) {}
 rpc SetProviderURLs(SetProviderURLsRequest) returns (Result) {}
 rpc ExportTrace(ExportTraceRequest) returns (Result) {}
 // Works without a running observatory.
 rpc AdaptiveHeader(AdaptiveHeaderRequest) returns (Result) {}
}
message Config {}
