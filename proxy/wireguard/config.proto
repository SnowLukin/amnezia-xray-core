syntax = "proto3";

package xray.proxy.wireguard;
option csharp_namespace = "Xray.Proxy.WireGuard";
option go_package = "github.com/xtls/xray-core/proxy/wireguard";
option java_package = "com.xray.proxy.wireguard";
option java_multiple_files = true;

import "common/protocol/user.proto";

message PeerConfig {
  string public_key = 1;
  string pre_shared_key = 2;
  string endpoint = 3;
  // The persistent keepalive in seconds: a number, or a range such as
  // "25-35" from which AmneziaWG picks every interval anew.
  string keep_alive = 4;
  repeated string allowed_ips = 5;
  // protocol_version of the peer in UAPI. AmneziaWG accepts only 1, the
  // version it speaks anyway; the field lets a config copied from UAPI load.
  // Numbered away from the upstream fields, like DeviceConfig.parameters.
  string protocol_version = 1000;
}

// AmneziaWG obfuscation parameters.
message AmneziaParameters {
  string jc = 1;
  string jmin = 2;
  string jmax = 3;
  string s1 = 4;
  string s2 = 5;
  string s3 = 6;
  string s4 = 7;
  string h1 = 8;
  string h2 = 9;
  string h3 = 10;
  string h4 = 11;
  string i1 = 12;
  string i2 = 13;
  string i3 = 14;
  string i4 = 15;
  string i5 = 16;
  // AmneziaWG 3.1 flags. Only outbounds apply them: the inbound writes no
  // AmneziaWG parameters to its device.
  //
  // random_trailers appends random bytes to handshake messages and pads
  // transport packets. Both sides must agree: a peer without it drops every
  // handshake.
  bool random_trailers = 17;
  // disable_cookies stops answering handshakes under load with cookies. That
  // is the side receiving handshake initiations, a server, so on an outbound
  // it does next to nothing.
  bool disable_cookies = 18;

  // AmneziaWG 3.1 device keys. Each is written to the device only when set,
  // so a config without them configures the device as before.
  //
  // header_protection_key, 32 bytes in hex, encrypts the header fields of
  // every message, with the S1-S4 padding as the nonce: each of S1-S4 must
  // be at least 12. Both sides must have the same key.
  string header_protection_key = 19;
  // content_padding_addition pads every transport packet with a number of
  // random bytes picked from the range. Only the side that sends uses it.
  string content_padding_addition = 20;
  // The timings of the protocol in seconds, and the handshake attempts, each
  // a number or a range from which the device picks anew every time. They
  // replace the constants of WireGuard: rekey after 120 s, rekey timeout
  // 5 s, reject after 180 s, keepalive timeout 10 s and 18 attempts.
  string rekey_after_time = 21;
  string rekey_timeout = 22;
  string reject_after_time = 23;
  string keepalive_timeout = 24;
  string max_handshake_attempts = 25;
}

message DeviceConfig {
  string secret_key = 1;
  repeated string endpoint = 2;
  repeated PeerConfig peers = 3;
  repeated xray.common.protocol.User users = 5;
  int32 mtu = 4;

  bytes reserved = 6;
  bool is_client = 8;
  bool no_kernel_tun = 9;
  repeated string DNS = 10;

  // Numbered away from the upstream fields so that new XTLS fields do not
  // take the same number.
  AmneziaParameters parameters = 1000;
}